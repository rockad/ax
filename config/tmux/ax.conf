# ax.conf: OpenCode-style top tab bar & bilingual keybindings for ax
# Inherits parent terminal emulator and tmux colors cleanly by default.

# -----------------------------------------------------------------------------
# 1. Top Tab Strip Styling (Inheriting Terminal Colors)
# -----------------------------------------------------------------------------
set -g status-position top
set -g status 2
set -g "status-format[1]" "#[bg=default,fill= ] "
set -g status-interval 1

# Base statusbar style: Inherit terminal foreground and background
set -g status-style "bg=default,fg=default"

# Window focus hook to auto-clear external sync alert
set-hook -g pane-focus-in "set-option -w @external_sync 0"
set-hook -g client-detached "run-shell 'ax reload'"
set-hook -g window-unlinked "run-shell 'ax reload'"

# Left section: Dynamic Prefix indicator (only appears when Prefix is engaged)
set -g status-left-length 40
set -g status-left "#{?#{client_prefix},#[fg=black]#[bg=brightred]#[bold] 󰘳 PREFIX #[default] ,}"

# Tab formatting: Flat highlighted tabs (zero round corners)
setw -g window-status-separator " "

# Inactive tab: distinct dark slate background (colour237) with soft text (colour250), status icons, and close button
setw -g window-status-format "#{?#{||:#{window_activity_flag},#{window_bell_flag}},#[fg=colour16]#[bg=colour220]#[bold] #I #{?#{||:#{@running},#{@agy_running}},#[fg=colour220]#[bold]● #[fg=colour16],#{?#{@remote_control},󰢹 ,󰂞 }}#{=22:window_name}#[range=user|close:#{window_id}] 󰅖#[norange] #[default],#{?#{@external_sync},#[fg=colour39]#[bg=colour237]#[bold] #I #{?#{||:#{@running},#{@agy_running}},#[fg=colour220]#[bold]● #[fg=colour39],#{?#{@remote_control},󰢹 ,󰛌 }}#{=22:window_name}#[range=user|close:#{window_id}] 󰅖#[norange] #[default],#[fg=colour250]#[bg=colour237] #I #{?#{||:#{@running},#{@agy_running}},#[fg=colour220]#[bold]● #[fg=colour250],#{?#{@remote_control},#[fg=colour75]󰢹 #[fg=colour250],}}#{=22:window_name}#[range=user|close:#{window_id}] #[fg=colour244]󰅖#[fg=colour250]#[norange] #[default]}}"

# Active tab: clean high-contrast highlight using muted teal (colour73) with dark ink text (colour234)
setw -g window-status-current-format "#[fg=colour234]#[bg=colour73]#[bold] #I #{?#{||:#{@running},#{@agy_running}},#[fg=colour220]#[bold]● #[fg=colour234],#{?#{@remote_control},#[fg=colour234]󰢹 #[fg=colour234],}}#{=22:window_name}#[range=user|close:#{window_id}] 󰅖#[norange] #[default]"

# Right section: Cleared by default to maximize top tab space
set -g status-right ""

# Bottom pane-border statusline (host project, time, git, and path)
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#[fg=colour73]#[bold],#[fg=colour244]} #{?#{@harness},#{@harness},#{?#{@active_harness},#{@active_harness},#{pane_current_command}}} #[default]· #[fg=colour250]#{?#{@ax_project},#{@ax_project},#{?#{@agymux_project},#{@agymux_project},#S}}#[default] · #(ax git-status \"#{pane_current_path}\") · #[fg=colour244]#{pane_current_path}#[default] #[align=right] #[fg=colour244]%H:%M · %Y-%m-%d #[default]"

# Style statusline messages so notifications/alerts are visible without obstructing
set -g message-style "bg=colour235,fg=colour73,bold"
set -g message-command-style "bg=colour235,fg=colour220,bold"
set -g display-time 2500

# -----------------------------------------------------------------------------
# 2. Prefix Definition (Ctrl+Space)
# -----------------------------------------------------------------------------
set -g prefix C-Space
bind-key C-Space send-prefix

# -----------------------------------------------------------------------------
# 3. Direct Tab Navigation (Alt + 1..9 / Arrows & Prefix + 1..9 / Arrows)
# -----------------------------------------------------------------------------
# Root-table prefix-less Alt tab navigation
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

bind-key -n M-Left  previous-window
bind-key -n M-Right next-window

# Prefix tab navigation
bind-key 1 select-window -t :1
bind-key 2 select-window -t :2
bind-key 3 select-window -t :3
bind-key 4 select-window -t :4
bind-key 5 select-window -t :5
bind-key 6 select-window -t :6
bind-key 7 select-window -t :7
bind-key 8 select-window -t :8
bind-key 9 select-window -t :9

bind-key Left  previous-window
bind-key Right next-window

# Window swap shortcuts (silent tab reordering)
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1
bind-key < swap-window -d -t -1
bind-key > swap-window -d -t +1
bind-key Б swap-window -d -t -1
bind-key Ю swap-window -d -t +1

# -----------------------------------------------------------------------------
# 4. Paired Bilingual Keybindings (English & RussianWin Layout Resilience)
# -----------------------------------------------------------------------------
# Switch Tab / Session (Ctrl+Space s / S / ы / Ы)
bind-key s display-popup -E -w 85% -h 75% "ax switch"
bind-key S display-popup -E -w 85% -h 75% "ax switch"
bind-key ы display-popup -E -w 85% -h 75% "ax switch"
bind-key Ы display-popup -E -w 85% -h 75% "ax switch"

# Switch Project (Ctrl+Space P / З)
bind-key P display-popup -E -w 85% -h 70% "ax project"
bind-key З display-popup -E -w 85% -h 70% "ax project"

# Actions / Command Palette (Ctrl+Space p / з)
bind-key p display-popup -E -w 75% -h 60% "ax palette"
bind-key з display-popup -E -w 75% -h 60% "ax palette"

# Keyboard Shortcuts Cheatsheet Modal (Ctrl+Space ? / h / H / р / Р)
bind-key ? display-popup -E -w 75% -h 70% "ax helper"
bind-key h display-popup -E -w 75% -h 70% "ax helper"
bind-key H display-popup -E -w 75% -h 70% "ax helper"
bind-key р display-popup -E -w 75% -h 70% "ax helper"
bind-key Р display-popup -E -w 75% -h 70% "ax helper"

# Harness Tab Creation
# Google Antigravity (Ctrl+Space n / N / т / Т)
bind-key n new-window -n "+ new" "ax run -H agy"
bind-key N new-window -n "+ new" "ax run -H agy"
bind-key т new-window -n "+ new" "ax run -H agy"
bind-key Т new-window -n "+ new" "ax run -H agy"

# Claude Code (Ctrl+Space c / C / с / С)
bind-key c new-window -n "+ new" "ax run -H claude"
bind-key C new-window -n "+ new" "ax run -H claude"
bind-key с new-window -n "+ new" "ax run -H claude"
bind-key С new-window -n "+ new" "ax run -H claude"

# OpenCode (Ctrl+Space o / O / щ / Щ)
bind-key o new-window -n "+ new" "ax run -H opencode"
bind-key O new-window -n "+ new" "ax run -H opencode"
bind-key щ new-window -n "+ new" "ax run -H opencode"
bind-key Щ new-window -n "+ new" "ax run -H opencode"

# Plain Terminal (Ctrl+Space t / T / е / Е)
bind-key t new-window -n "term" "ax run -H term"
bind-key T new-window -n "term" "ax run -H term"
bind-key е new-window -n "term" "ax run -H term"
bind-key Е new-window -n "term" "ax run -H term"

# New Worktree Tab (Ctrl+Space w / W / ц / Ц)
bind-key w display-popup -E -w 65% -h 35% "ax palette worktree"
bind-key W display-popup -E -w 65% -h 35% "ax palette worktree"
bind-key ц display-popup -E -w 65% -h 35% "ax palette worktree"
bind-key Ц display-popup -E -w 65% -h 35% "ax palette worktree"

# Rename Tab (Ctrl+Space r / R / к / К)
bind-key r command-prompt -I "#W" "run-shell 'ax rename \"%%\"'"
bind-key к command-prompt -I "#W" "run-shell 'ax rename \"%%\"'"

# Fork Tab / Conversation (Ctrl+Space f / F / а / А)
bind-key f display-popup -E -w 65% -h 35% "ax palette fork"
bind-key F display-popup -E -w 65% -h 35% "ax palette fork"
bind-key а display-popup -E -w 65% -h 35% "ax palette fork"
bind-key А display-popup -E -w 65% -h 35% "ax palette fork"

# Launch with Custom Flags (Ctrl+Space l / L / д / Д)
bind-key l display-popup -E -w 75% -h 55% "ax palette flags"
bind-key L display-popup -E -w 75% -h 55% "ax palette flags"
bind-key д display-popup -E -w 75% -h 55% "ax palette flags"
bind-key Д display-popup -E -w 75% -h 55% "ax palette flags"

# Close Tab (Ctrl+Space x / X / ч / Ч / q / Q / й / Й / &)
bind-key x if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key X if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key ч if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key Ч if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key q if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key Q if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key й if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key Й if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }
bind-key & if-shell -F '#{>:#{session_windows},1}' { kill-window } { confirm-before -p "Close final tab #W? (y/n)" kill-window }

# Switch to Main Terminal Session (Ctrl+Space m / M / ь / Ь)
bind-key m run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key M run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key ь run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"
bind-key Ь run-shell "tmux new-session -d -s main 2>/dev/null; tmux switch-client -t main"

# Join Tab as Split Pane (Ctrl+Space j / J / о / О)
bind-key j display-popup -E -w 75% -h 55% "ax join"
bind-key J display-popup -E -w 75% -h 55% "ax join"
bind-key о display-popup -E -w 75% -h 55% "ax join"
bind-key О display-popup -E -w 75% -h 55% "ax join"

# Unsplit Pane to Tab (Ctrl+Space u / U / г / Г)
bind-key u run-shell "tmux break-pane -d"
bind-key U run-shell "tmux break-pane -d"
bind-key г run-shell "tmux break-pane -d"
bind-key Г run-shell "tmux break-pane -d"

# -----------------------------------------------------------------------------
# 5. Mouse Interactions for Tabs (OpenCode Ergonomics & Protection)
# -----------------------------------------------------------------------------
bind-key -T root MouseDown1Status if-shell -F '#{m/r:^close,#{mouse_status_range}}' { run-shell 'ax close-window "#{mouse_status_range}"' } { select-window -t = ; set-option -F @drag_window '#{window_id}' }
bind-key -T root MouseDrag1Status if-shell -F '#{@drag_window}' { run-shell -C 'swap-window -d -s #{@drag_window} -t =' }
bind-key -T root MouseDragEnd1Status if-shell -F '#{@drag_window}' { run-shell -C 'swap-window -d -s #{@drag_window} -t =' ; set-option -u @drag_window }
bind-key -T root MouseUp1Status if-shell -F '#{@drag_window}' { if-shell -F '#{!=:#{@drag_window},#{window_id}}' { swap-window -d -s '#{@drag_window}' -t = } ; set-option -u @drag_window }

bind-key -T root MouseDown2Status if-shell -F '#{>:#{session_windows},1}' {
    kill-window -t =
} {
    confirm-before -p "Close final tab #W? (y/n)" "kill-window -t ="
}

bind-key -T root MouseDown3Status display-menu -t = -T "#W Actions" \
    "Close Tab" x "if-shell -F '#{>:#{session_windows},1}' { kill-window -t = } { confirm-before -p \"Close final tab #W? (y/n)\" \"kill-window -t =\" }" \
    "Rename Tab" r "command-prompt -I '#W' 'run-shell \"ax rename \\\"%%\\\"\"'" \
    "Reset Tab Title" R "set-option -w -t = @user_renamed 0; run-shell 'ax hook'" \
    "Fork Tab" f "display-popup -E -w 65% -h 35% 'ax palette fork'" \
    "Join Tab as Split..." J "display-popup -E -w 75% -h 55% 'ax join'" \
    "Unsplit Pane to Tab" U "run-shell 'tmux break-pane -d'" \
    "Reload Session" S "run-shell 'ax palette -a reload'"
