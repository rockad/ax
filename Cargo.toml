[package]
name = "ax"
version = "0.8.0"
default-run = "ax"
edition = "2021"
authors = ["Aleksandr Korolev"]
description = "Terminal cockpit & multi-harness multiplexor for AI coding agents"
license = "MIT"
repository = "https://github.com/rockad/ax"
readme = "README.md"
keywords = ["antigravity", "tmux", "terminal", "ai-assistant", "cockpit", "multi-harness", "multiplexer", "codex", "opencode", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ax"
path = "src/lib.rs"

[[bin]]
name = "ax"
path = "src/bin/ax.rs"


[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
nucleo-matcher = "0.3"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"
proptest = "1.5"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

